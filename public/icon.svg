<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Ornate Center Circle Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="148" fill="#042f2e" fill-opacity="0.5"/>

  <!-- Tasbeeh Beads circling around -->
  <!-- 12 decorative beads -->
  <g fill="url(#goldGrad)">
    <circle cx="256" cy="115" r="9"/>
    <circle cx="326" cy="134" r="9"/>
    <circle cx="378" cy="186" r="9"/>
    <circle cx="397" cy="256" r="9"/>
    <circle cx="378" cy="326" r="9"/>
    <circle cx="326" cy="378" r="9"/>
    <circle cx="256" cy="397" r="12" filter="url(#glow)"/> <!-- Central Imama/Leader bead -->
    <circle cx="186" cy="378" r="9"/>
    <circle cx="134" cy="326" r="9"/>
    <circle cx="115" cy="256" r="9"/>
    <circle cx="134" cy="186" r="9"/>
    <circle cx="186" cy="134" r="9"/>
  </g>

  <!-- Central Crescent & Star -->
  <path d="M 285 180 A 75 75 0 1 0 285 320 A 60 60 0 1 1 285 180 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Eight-pointed Islamic Star -->
  <polygon points="310,230 318,242 332,242 322,252 326,266 312,258 298,266 302,252 292,242 306,242" fill="#fef08a"/>
</svg>
